name: reversal-asr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/asr.yml"

permissions:
  contents: write

jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (ffmpeg + faster-whisper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper

      - name: Download videos + transcribe
        run: python scripts/download_and_asr.py

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reversal-videos
          path: videos/*.mp4
          if-no-files-found: ignore

      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts || true
          if git diff --cached --quiet; then
            echo "no transcript changes"
          else
            git commit -m "transcripts: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
